name: Verify StageLock
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: bash -n scripts/deploy-aws.sh scripts/deploy-private-aws.sh scripts/show-review-wallets.sh infra/private-chain/start-instance.sh
      - run: pipx run cfn-lint --non-zero-exit-code error infra/hosting.yaml infra/private-hosting.json
      - run: npm test
      - run: npm run compile
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
